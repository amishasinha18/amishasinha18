name: Numbers

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  numbers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the cards
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 scripts/make_numbers.py

      - name: Commit the cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/numbers.svg assets/achievements.svg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update numbers cards"
            git pull --rebase
            git push
          fi
